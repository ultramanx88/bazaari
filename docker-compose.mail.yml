version: '3.8'

services:
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: bazaari-mailserver
    hostname: mail.bazaari.com
    env_file: mailserver.env
    ports:
      - "25:25"    # SMTP
      - "143:143"  # IMAP
      - "465:465"  # SMTPS
      - "587:587"  # Submission
      - "993:993"  # IMAPS
    volumes:
      - ./docker-data/dms/mail-data/:/var/mail/
      - ./docker-data/dms/mail-state/:/var/mail-state/
      - ./docker-data/dms/mail-logs/:/var/log/mail/
      - ./docker-data/dms/config/:/tmp/docker-mailserver/
      - /etc/localtime:/etc/localtime:ro
      - ./certs/:/certs/:ro
    restart: always
    stop_grace_period: 1m
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: "ss -lntp | grep -E ':25|:465|:587|:993'"
      timeout: 45s
      interval: 30s
      retries: 5

  # Web interface for mail management
  roundcube:
    image: roundcube/roundcubemail:latest
    container_name: bazaari-webmail
    ports:
      - "8080:80"
    environment:
      - ROUNDCUBEMAIL_DEFAULT_HOST=mailserver
      - ROUNDCUBEMAIL_SMTP_SERVER=mailserver
      - ROUNDCUBEMAIL_SMTP_PORT=587
      - ROUNDCUBEMAIL_DEFAULT_PORT=143
    depends_on:
      - mailserver
    restart: always

  # Database for Roundcube
  roundcube-db:
    image: mariadb:10.6
    container_name: bazaari-webmail-db
    environment:
      - MYSQL_ROOT_PASSWORD=roundcube_root_password
      - MYSQL_DATABASE=roundcube
      - MYSQL_USER=roundcube
      - MYSQL_PASSWORD=roundcube_password
    volumes:
      - ./docker-data/roundcube-db:/var/lib/mysql
    restart: always

networks:
  default:
    name: bazaari-mail-network